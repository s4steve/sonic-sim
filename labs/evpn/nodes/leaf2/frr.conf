router bgp 65002
 bgp router-id 10.255.1.2
 no bgp ebgp-requires-policy
 neighbor 10.1.2.0 remote-as 65100
 neighbor 10.2.2.0 remote-as 65100
 address-family ipv4 unicast
  network 10.255.1.2/32
 exit-address-family
 address-family l2vpn evpn
  neighbor 10.1.2.0 activate
  neighbor 10.2.2.0 activate
  advertise-all-vni
 exit-address-family
exit
