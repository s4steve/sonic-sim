<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SONiC Lab</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xyflow/react@12.3.6/dist/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<script type="importmap">
{"imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
  "@xyflow/react": "https://esm.sh/@xyflow/react@12.3.6?external=react,react-dom",
  "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
  "htm": "https://esm.sh/htm@3.1.1",
  "@xterm/xterm": "https://esm.sh/@xterm/xterm@5.5.0",
  "@xterm/addon-fit": "https://esm.sh/@xterm/addon-fit@0.10.0"
}}
</script>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --border: #d9dde3; --text: #1b1f24; --muted: #667080;
  --accent: #2563eb; --sonic: #e8efff; --host: #eef7ee; --up: #16a34a; --down: #9aa3ae; --err: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --border: #2a313a; --text: #e6e9ee; --muted: #8b95a3;
    --accent: #60a5fa; --sonic: #1c2740; --host: #1b2a1f; --up: #22c55e; --down: #4b5563; --err: #f87171;
  }
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
#root { display: grid; grid-template: "top top" auto "canvas side" 1fr "term term" auto / 1fr 280px; }
header { grid-area: top; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px;
  background: var(--panel); border-bottom: 1px solid var(--border); }
header h1 { font-size: 15px; margin: 0 8px 0 0; }
.msg { color: var(--muted); margin-left: auto; font-size: 13px; }
.msg.err { color: var(--err); }
main { grid-area: canvas; position: relative; min-height: 300px; }
aside { grid-area: side; background: var(--panel); border-left: 1px solid var(--border); padding: 12px; overflow: auto; }
aside h2 { font-size: 14px; margin: 0 0 8px; }
aside label { display: block; margin: 8px 0 2px; color: var(--muted); font-size: 12px; }
aside input, aside select { width: 100%; }
button, select, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px; }
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: var(--err); }
.row { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 12px; margin-top: 12px; }
.node { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); min-width: 90px; text-align: center; color: var(--text); }
.node.sonic { background: var(--sonic); }
.node.host { background: var(--host); border-radius: 18px; }
.node .name { font-weight: 600; }
.node .meta { font-size: 11px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--down); vertical-align: middle; margin-left: 4px; }
.dot.running { background: var(--up); }
.bgp { font-size: 10px; margin-top: 3px; border-radius: 4px; padding: 0 4px; }
.bgp.good { color: var(--up); }
.bgp.bad { color: #fff; background: var(--err); }
.port { display: inline-block; font-size: 12px; margin: 2px 4px 2px 0; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border); }
.port.up { border-color: var(--up); color: var(--up); }
.port.down { border-color: var(--err); color: var(--err); }
a.btn { font-size: 13px; color: var(--text); text-decoration: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; }
a.btn:hover { border-color: var(--accent); }
textarea.code { width: 100%; height: 50vh; font: 12px/1.4 ui-monospace, monospace; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
.dlg-body label.check.inline { display: inline-flex; margin-right: 12px; }
aside .grid2 { gap: 6px; }
.result { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.react-flow__node.selected .node { outline: 2px solid var(--accent); }
.end { position: absolute; font-size: 10px; line-height: 1.25; text-align: center; padding: 1px 4px; border-radius: 4px;
  background: var(--panel); border: 1px solid var(--border); color: var(--text); pointer-events: none; white-space: nowrap; }
.term { grid-area: term; height: 300px; background: #000; border-top: 1px solid var(--border); display: flex; flex-direction: column; }
.term .bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; background: var(--panel); }
.term .xterm-host { flex: 1; padding: 4px; min-height: 0; }
.modal { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; z-index: 10; }
.dialog { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; max-width: 95vw; }
.dialog.wide { width: 1000px; height: 90vh; display: flex; flex-direction: column; padding: 0; }
.dlg-head { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.dlg-head h2 { font-size: 15px; margin: 0; }
.dlg-head nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
.tab { border-color: transparent; }
.tab.on { border-color: var(--accent); color: var(--accent); }
.dlg-body { flex: 1; overflow: auto; padding: 12px 16px; }
.dlg-foot { border-top: 1px solid var(--border); padding: 10px 16px; max-height: 40%; overflow: auto; }
.dlg-body label { display: block; margin: 8px 0 2px; color: var(--muted); font-size: 12px; }
.dlg-body label input:not([type=checkbox]) { display: block; width: 100%; margin-top: 2px; }
.dlg-body label.check { display: flex; gap: 6px; align-items: flex-start; color: var(--text); font-size: 13px; }
.dlg-body h3 { font-size: 13px; margin: 14px 0 4px; }
table { border-collapse: collapse; margin: 4px 0; }
th, td { text-align: left; padding: 3px 8px 3px 0; vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
.muted { color: var(--muted); font-size: 12px; }
input.num { width: 72px; }
fieldset { border: 1px solid var(--border); border-radius: 8px; margin: 0 0 12px; padding: 8px 12px; overflow-x: auto; min-width: 0; }
.dlg-body td input:not(.num):not([type=checkbox]) { width: 130px; }
.dlg-body .grid2 label select { display: block; margin-top: 2px; }
legend { font-weight: 600; padding: 0 4px; }
legend label.check { margin: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.raw textarea { width: 100%; height: 55vh; font: 12px/1.4 ui-monospace, monospace; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
pre.diff { font: 12px/1.4 ui-monospace, monospace; background: var(--bg); padding: 8px; border-radius: 6px; overflow: auto; max-height: 160px; margin: 6px 0; }
.warn { color: var(--err); font-size: 13px; margin: 2px 0; }
.ok { color: var(--up); font-size: 13px; margin: 2px 0; }
@media (max-width: 700px) {
  .grid2 { grid-template-columns: 1fr; }
  .dialog.wide { height: 100vh; max-width: 100vw; border-radius: 0; }
  #root { grid-template: "top" auto "canvas" 1fr "side" auto "term" auto / 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--border); }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="app.js"></script>
</body>
</html>
